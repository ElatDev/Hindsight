name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      # postinstall fetches the Stockfish binary for this OS and rebuilds
      # better-sqlite3 against Electron's ABI; the engine tests need the
      # former.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
